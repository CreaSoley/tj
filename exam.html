<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur Passage de Grade</title>

<link rel="stylesheet" href="banner.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<style>
/* override simple pour ton module */
.grid { display:grid !important; grid-template-columns:1fr !important; gap:20px !important; width:100%; }
</style>
</head>

<body data-subtitle="🌸 Simulateur Passage de Grade 🌸">

<div id="bannerContainer"></div>

<div class="main-wrapper">
  <div class="card-kawaii">
    <div class="module-title">Simulateur Passage de Grade</div>

    <div class="sub-section">
      <h3>Mode</h3>
      <div class="controls-row">
        <button id="modeBtn" class="btn-kawaii secondary">Mode Examen</button>
        <span class="muted">→ cliquez pour changer</span>
      </div>
    </div>

    <div class="sub-section">
      <h3>Paramètres candidats</h3>
      <div class="controls-row">
        <label>Genre</label>
        <select id="candidateTitle" class="input-small">
          <option value="Monsieur">Monsieur</option>
          <option value="Madame">Madame</option>
        </select>
      </div>
      <div class="controls-row">
        <label>Nom du candidat</label>
        <input id="candidate" class="input-wide" placeholder="Nom du candidat">
      </div>
    </div>

    <div class="sub-section">
      <h3>Ordre et durée des UV</h3>
      <div class="controls-row">
        <label>Préconfigurations</label>
        <select id="presetOrder" class="input-wide">
          <option value="custom">Personnalisé</option>
          <option value="exam">Examen (1-2-3-4-5-6)</option>
          <option value="adapt">Adapté (1-4-2-5-1-6)</option>
        </select>
      </div>
      <div id="uvConfig"></div>
    </div>

    <div class="sub-section">
      <h3>Pause entre UV</h3>
      <div class="controls-row">
        <label>Durée (min)</label>
        <input id="pauseDuration" class="input-small" type="number" min="0" max="5" value="0">
      </div>
    </div>

    <div class="button-row">
      <button class="btn-kawaii start" onclick="startExam()">▶️ Lancer</button>
      <button class="btn-kawaii pause" onclick="togglePause()">⏸</button>
      <button class="btn-kawaii stop btn-stop" onclick="stopExam()">⏹</button>
    </div>

    <div class="result-display">
      <div id="text">Prêt</div>
      <div id="countdown">00:00</div>
      <div id="currentText"></div>
    </div>

    <div class="sub-section">
      <h3>Récap / Log</h3>
      <div id="log"></div>
    </div>

  </div>
</div>

<script>
fetch("banner.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("bannerContainer").innerHTML = html;
    const subtitle = document.body.dataset.subtitle;
    if(subtitle) document.getElementById("uv-title").textContent = subtitle;
  });
</script>

<script src="simulateur-global.js"></script>
<script src="uv2-exam.js"></script>
<script src="uv56-exam.js"></script>

</body>
</html>
