<!DOCTYPE html>
<html lang="fr" data-subtitle="🌸 Passage de Grade 🌸">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen – Passage de Grade</title>

<link rel="stylesheet" href="banner.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<style>
.grid{
  display:grid !important;
  grid-template-columns:1fr !important;
}
</style>
</head>

<body data-subtitle="🌸 Examen Officiel 🌸">

<div id="bannerContainer"></div>
<script>
fetch("banner.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("bannerContainer").innerHTML = html;
    const subtitle = document.body.dataset.subtitle;
    if(subtitle){
      const el = document.getElementById("uv-title");
      if(el) el.textContent = subtitle;
    }
  });
</script>


<div class="main-wrapper">

  <div class="card-kawaii">
    <div class="module-title">Simulateur Passage de Grade</div>

    <div class="sub-section">
      <h3>Paramètres généraux</h3>
      <div class="controls-row">
        <label>Genre</label>
        <select id="candidateTitle">
          <option value="Monsieur">Monsieur</option>
          <option value="Madame">Madame</option>
        </select>
      </div>
      <div class="controls-row">
        <label>Nom du candidat</label>
        <input id="candidate" class="input-wide" placeholder="Nom du candidat">
      </div>
    </div>

<div class="card-kawaii">
  <h3>Mode</h3>
  <button id="modeBtn" class="btn-kawaii secondary">
    Mode : Examen
  </button>
</div>

   <div class="card-kawaii">
  <h3>Ordre des UV</h3>

  <select id="presetSelect" class="input-wide">
    <option value="">— Ordre personnalisé —</option>
    <option value="standard">Ordre officiel (1→6)</option>
    <option value="adapte">Ordre adapté</option>
  </select>

  <ul id="uvOrderList" class="content"></ul>
</div>
 
    
    <div class="sub-section">
      <h3>Ordre et durée des UV</h3>
      <div id="uvConfig"></div>
    </div>

    <div class="card">
  <h2>Pause entre UV</h2>
  <div class="row">
    <label>Durée de la pause (minutes)</label>
  <input id="pauseDuration" type="number" min="0" max="5" value="0">
    <span id="pauseVal">0 min</span>
  </div>
</div>

    
    <div class="sub-section">
      <h3>Paramètres UV2</h3>
      <div class="controls-row">
        <label>Intervalle UV2 (s)</label>
        <input id="uv2-interval" type="number" min="1" max="20" value="5" class="input-small">
      </div>
      <div class="controls-row">
        <label>Bip UV2</label>
        <span id="uv2-beep-icon" class="beep-icon off">🔇</span>
      </div>
    </div>

    <div class="sub-section">
      <h3>Paramètres UV5 / UV6</h3>
      <div class="controls-row">
        <label>Nombre de techniques UV5</label>
        <input type="number" id="uv5-count" min="1" max="20" value="8" class="input-small">
      </div>
      <div class="controls-row">
        <label>Intervalle UV5 (s)</label>
        <input type="number" id="uv5-read-interval" min="5" max="30" value="15" class="input-small">
      </div>

      <div class="controls-row">
        <label>Nombre de techniques UV6</label>
        <input type="number" id="uv6-count" min="1" max="20" value="8" class="input-small">
      </div>
      <div class="controls-row">
        <label>Intervalle UV6 (s)</label>
        <input type="number" id="uv6-read-interval" min="5" max="30" value="15" class="input-small">
      </div>
    </div>

    <div class="button-row">
      <button class="btn-kawaii start" onclick="startExam()">▶️ Lancer</button>
      <button class="btn-kawaii pause" onclick="togglePause()">⏸</button>
      <button class="btn-kawaii stop btn-stop" onclick="stopExam()">⏹</button>
    </div>

    <div class="result-display" id="visual">
      <div id="text">Prêt</div>
      <div id="countdown">00:00</div>
      <div id="currentText"></div>
    </div>

    <div class="sub-section">
      <h3>Récap / Log</h3>
      <div id="log"></div>
    </div>

  </div>
</div>

<script src="uv1-exam.js"></script>
<script src="uv2-exam.js"></script>
<script src="uv56-exam.js"></script>
<script src="simulateur-global.js"></script>

</body>
</html>
