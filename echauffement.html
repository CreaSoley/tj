<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Échauffements</title>

  <!-- CSS EXISTANT -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-wrapper">
    <div class="grid">

      <div class="card-kawaii bg-surplace">

        <div class="module-title" id="exercise-title">
          Échauffement
        </div>

        <div class="sub-section">
          <h3 id="phase-title">Phase</h3>
<!-- Sélecteur échauffement -->
<div class="sub-section">
  <h3>Choix de l’échauffement</h3>

  <select id="exercise-select" class="input-wide"></select>

  <div id="exercise-description" class="result-display">
    Sélectionne un échauffement pour voir sa description.
  </div>
</div>

<!-- Barre de progression -->
<div class="sub-section">
  <h3>Progression</h3>
  <progress id="progress-bar" value="0" max="600" style="width:100%; height:20px;"></progress>
</div>

          <div id="visual" class="result-display">
            Appuie sur ▶ pour commencer
          </div>

          <div class="result-display" id="timer-display">
            10:00
          </div>

          <div class="button-row">
            <button class="btn-kawaii" id="btn-start">▶ Démarrer</button>
            <button class="btn-kawaii btn-stop" id="btn-stop">■ Stop</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="echauffements.js"></script>
</body>
</html>
