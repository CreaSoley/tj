<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Échauffements</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="banner.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-subtitle="Échauffement">

  <!-- BANNIERE -->
  <header class="appbar">
    <a href="index.html" class="logo-link">
      <img src="assets/logopwa.png" class="logo-big" alt="logo">
    </a>

    <div class="header-text">
      <div class="title shanghai" style="font-size:1.3rem;">Taï-jitsu</div>
      <div class="subtitle spicy" id="uv-title" style="font-size:1.8rem;">Sous-titre</div>
    </div>
  </header>

  <div class="main-wrapper">
    <div class="card-kawaii">
      <div class="module-title">Échauffements assistés</div>

      <div class="controls-row">
  <label for="selectEchauff">Choisir un échauffement :</label>
  <select id="selectEchauff"></select>
</div>

<div id="presentation" class="result-display"></div>

<div id="visual" class="sub-section">
  <details>
    <summary>Script vocal (accroche)</summary>
    <div id="scriptAccordion"></div>
  </details>
</div>

<div class="result-display">
  <div>Temps total estimé : <span id="totalTime"></span></div>
  <div>Temps restant : <span id="countdown"></span></div>
</div>

<div class="button-row">
  <button id="startBtn" class="btn-kawaii">Lecture</button>

  <button id="stopBtn" class="btn-kawaii btn-stop">Stop</button>
</div>

        <div class="progress-wrapper" style="margin-top: 12px;">
          <div id="progressBar" style="height: 12px; width:100%; border-radius: 12px; background:#ffd6ec; overflow:hidden;">
            <div id="progressFill" style="height:100%; width:0%; background:linear-gradient(90deg, #ff5fc1, #ff1493);"></div>
          </div>
          <div style="margin-top:8px; display:flex; justify-content:space-between;">
            <span id="timeLeft">10:00</span>
            <span id="timeTotal">10:00</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="echauffements.js"></script>
</body>
</html>
